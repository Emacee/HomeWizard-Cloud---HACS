[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Explicit rule set, so results don't depend on the defaults of a ruff release.
select = [
    "ASYNC", # async pitfalls
    "B",     # bugbear
    "C4",    # comprehensions
    "DTZ",   # naive datetimes
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "G",     # logging format
    "I",     # import order
    "LOG",   # logging
    "PERF",  # performance
    "PIE",   # misc
    "RUF",   # ruff-specific, incl. unused noqa
    "SIM",   # simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "E501", # line length is left to the formatter
]
